name: Frontend checks

on:
  pull_request:
    paths:
      - 'poa-app/**'
      - '.github/workflows/frontend-checks.yml'
      - '.github/workflows/deploy-ipfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poa-app
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: yarn
          cache-dependency-path: poa-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit and component integration tests
        run: yarn test

      - name: Build static site
        run: yarn build

      - name: Verify production excludes E2E code
        run: yarn e2e:check
